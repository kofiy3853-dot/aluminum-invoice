services:
  - type: web
    name: whoknows-estimate-reader
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
